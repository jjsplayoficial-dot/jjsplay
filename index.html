<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>JJSPLAY</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#0f172a;
  color:#fff;
}

.login {
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

.login h1 {
  color:#38bdf8;
  margin-bottom:20px;
  font-size:32px;
}

input {
  padding:12px;
  margin:8px;
  width:250px;
  border:none;
  border-radius:8px;
}

button {
  padding:12px;
  width:270px;
  background:#38bdf8;
  border:none;
  border-radius:8px;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

.player {
  display:none;
}

video {
  width:100%;
  height:100vh;
  background:black;
}
</style>
</head>

<body>

<div class="login" id="login">
  <h1>JJSPLAY</h1>
  <input type="text" id="user" placeholder="Usuário">
  <input type="password" id="pass" placeholder="Senha">
  <button onclick="entrar()">ENTRAR</button>
</div>

<div class="player" id="player">
  <video id="video" controls autoplay></video>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
function entrar() {
  let user = document.getElementById("user").value;
  let pass = document.getElementById("pass").value;

  // 🔥 SEU SERVIDOR JÁ CONFIGURADO
  let servidor = "http://tzprosata.fun:8080";

  let url = servidor + "/get.php?username=" + user + "&password=" + pass + "&type=m3u_plus&output=ts";

  fetch(url)
  .then(res => res.text())
  .then(data => {
    let linhas = data.split("\n");
    let stream = linhas.find(l => l.startsWith("http"));

    if (!stream) {
      alert("Login inválido ou lista vazia!");
      return;
    }

    iniciarPlayer(stream);
  })
  .catch(() => {
    alert("Erro ao conectar no servidor!");
  });
}

function iniciarPlayer(link) {
  document.getElementById("login").style.display = "none";
  document.getElementById("player").style.display = "block";

  let video = document.getElementById("video");

  if (Hls.isSupported()) {
    let hls = new Hls();
    hls.loadSource(link);
    hls.attachMedia(video);
  } else {
    video.src = link;
  }
}
</script>

</body>
</html>
