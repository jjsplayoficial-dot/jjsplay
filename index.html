<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
document.getElementById("btn").addEventListener("click", entrar);

async function entrar() {
  const user = document.getElementById("user").value.trim();
  const pass = document.getElementById("pass").value.trim();

  if (!user || !pass) {
    alert("Preencha usuário e senha");
    return;
  }

  try {
    // chama sua API no Vercel (sem CORS)
    const resp = await fetch(`/api/m3u?user=${encodeURIComponent(user)}&pass=${encodeURIComponent(pass)}`);
    const data = await resp.text();

    // pega o primeiro stream após #EXTINF
    const linhas = data.split("\n");
    let stream = null;

    for (let i = 0; i < linhas.length; i++) {
      if (linhas[i].startsWith("#EXTINF")) {
        stream = (linhas[i + 1] || "").trim();
        break;
      }
    }

    if (!stream || !stream.startsWith("http")) {
      alert("Não encontrou canal válido.");
      return;
    }

    iniciarPlayer(stream);

  } catch (e) {
    alert("Erro ao conectar.");
  }
}

function iniciarPlayer(link) {
  document.getElementById("login").style.display = "none";
  const video = document.getElementById("video");
  video.style.display = "block";

  if (Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(link);
    hls.attachMedia(video);
  } else {
    video.src = link;
  }
}
</script>
